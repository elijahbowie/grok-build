<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0b" />
    <title>Grok Build is offline</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #090b0b; color: #f2f3f1; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(38rem, calc(100% - 2rem)); border: 1px solid #414747; border-radius: 8px; padding: clamp(1.5rem, 6vw, 3rem); background: #0e1010; }
      .mark { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; margin-bottom: 1.5rem; color: #090b0b; background: #f2f3f1; clip-path: polygon(50% 0, 94% 25%, 94% 75%, 50% 100%, 6% 75%, 6% 25%); font-weight: 700; }
      .eyebrow { color: #858b86; text-transform: uppercase; letter-spacing: .1em; font-size: .75rem; font-weight: 700; }
      h1 { font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; margin: .5rem 0 1rem; }
      p { max-width: 34rem; color: #b2b7b3; margin: 0 0 1.5rem; }
      button { min-height: 44px; border: 0; border-radius: 6px; background: #f2f3f1; color: #090b0b; padding: .75rem 1rem; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 2px solid #c2d7ff; outline-offset: 3px; }
      @media (forced-colors: active) { main, button { border: 1px solid CanvasText; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">X</div>
      <div class="eyebrow">Connection status</div>
      <h1>Live state is unavailable.</h1>
      <p>Grok Build is offline. Task status, approvals, logs, evidence, and terminal output shown previously may now be stale. Reconnect before making a decision.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
