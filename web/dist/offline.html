<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <title>Grok Build is offline</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; background: #f6f5f2; color: #161616; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(36rem, calc(100% - 3rem)); border-top: 4px solid #d96b35; padding-top: 2rem; }
      h1 { font-size: clamp(2rem, 8vw, 4rem); line-height: 1; letter-spacing: -.04em; margin: 0 0 1rem; }
      p { max-width: 32rem; }
      button { border: 1px solid currentColor; background: #161616; color: #fff; padding: .75rem 1rem; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #d96b35; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) { :root { background: #161616; color: #f6f5f2; } button { background: #f6f5f2; color: #161616; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Live state is unavailable.</h1>
      <p>Grok Build is offline. Task status, approvals, logs, evidence, and terminal output shown previously may now be stale. Reconnect before making a decision.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
